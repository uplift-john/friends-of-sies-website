pillars:
  - title: good teachers
    image: /assets/images/garden-teacher.jpg
    imageAlt: A smiling SIES teacher holds up a leafy potato plant pulled from the school garden
    example: The Spanish teacher, the certified technology teacher, and academic interventionists. All the educators the district budget doesn't cover.
    items:
      - Spanish instruction
      - Certified technology teacher
      - Academic interventionists and classroom support
      - Instructional resources and professional development
  - title: Hands-On Science & Nature
    image: /assets/images/garden-harvest.jpg
    imageAlt: Students proudly show radishes they harvested from the Green Heart garden beds
    example: Engaging science on campus, including the wet lab, aquarium touch tanks, and the Green Heart garden.
    items:
      - The wet lab and aquarium touch tanks
      - The Green Heart gardening program
      - Science labs and materials
  - title: Arts & Enrichment
    image: /assets/images/photo7.png
    imageAlt: kids making art with playdoh
    example: Art and music programs and enrichment days that round out every student's week.
    items:
      - Art and music programs
      - Enrichment days
  - title: A Better Campus
    image: /assets/images/playground-community.jpg
    imageAlt: Families and children enjoy the shaded school playground together
    example: Playground improvements and athletic facilities like the basketball court and track.
    items:
      - Playground improvements
      - Basketball court and track
  - title: Every Student Supported
    image: /assets/images/classroom-tech.jpg
    imageAlt: Students smile while working on laptops in a bright SIES classroom
    example: Calmer, safer dismissals and intervention services for students who need extra help.
    items:
      - Academic intervention and student support services
      - The silent dismissal initiative and School Dismissal Manager
