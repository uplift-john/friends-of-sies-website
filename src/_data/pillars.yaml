# Value pillars (CONTEXT.md §3)
- title: Great Teachers
  example: The Spanish teacher, the certified technology teacher, and academic interventionists — educators the district budget doesn't cover.
  items:
    - Spanish instruction
    - Certified technology teacher
    - Academic interventionists and classroom support
    - Instructional resources and professional development
- title: Hands-On Science & Nature
  example: Live marine science on campus — the wet lab, aquarium touch tanks, and the Green Heart garden.
  items:
    - The wet lab and aquarium touch tanks
    - The Green Heart gardening program
    - Science labs and materials
- title: Arts & Enrichment
  example: Art and music programs and enrichment days that round out every student's week.
  items:
    - Art and music programs
    - Enrichment days
- title: A Better Campus
  example: Playground improvements and athletic facilities like the basketball court and track.
  items:
    - Playground improvements
    - Athletic facilities — basketball court and track
- title: Every Student Supported
  example: Calmer, safer dismissals and intervention services for students who need extra help.
  items:
    - Academic intervention and student support services
    - The silent dismissal initiative and School Dismissal Manager
