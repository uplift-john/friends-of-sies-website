name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, 'suggest-*']
  workflow_dispatch:

# Serialize deploys so parallel suggest-* pushes don't burst the
# Cloudflare Pages API and trip rate limits (error 10429).
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy (with retry on transient rate limits)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy _site \
                 --project-name=friends-of-sies \
                 --branch="${GITHUB_REF_NAME}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            wait=$((attempt * 30))
            echo "Deploy attempt $attempt failed; retrying in ${wait}s..."
            sleep "$wait"
          done
          echo "All deploy attempts failed."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
